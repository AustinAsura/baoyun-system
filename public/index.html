<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>装置保运部 - 主页</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="header">
        <div class="logo-area">
            <img src="logo.png" alt="Logo">
            <h1>装置保运部</h1>
        </div>
        <div class="nav-links">
            <a href="admin.html">进入管理后台</a>
        </div>
    </header>

    <div class="container">
        <!-- 标语 -->
        <div class="banner">
            <h2>保障设备稳定运行 铸就生产坚实后盾</h2>
        </div>

        <!-- 上半部分：通知与制度 -->
        <div class="grid-2">
            <!-- 通知公告 -->
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">📢 通知公告</div>
                    <a href="more.html?category=notice" class="more-link">更多...</a>
                </div>
                <ul class="file-list" id="list-notice"></ul>
            </div>
            
            <!-- 部门文件与规章 -->
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-title">📁 部门文件与规章</div>
                    <a href="more.html?category=regulation" class="more-link">更多...</a>
                </div>
                <ul class="file-list" id="list-regulation"></ul>
            </div>
        </div>

        <!-- 每周会议纪要 -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title purple">📝 每周会议纪要</div>
                <a href="more.html?category=meeting" class="more-link">更多...</a>
            </div>
            <ul class="file-list" id="list-meeting"></ul>
        </div>

        <!-- 装置保运半月刊 -->
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title blue">📖 装置保运半月刊</div>
            </div>
            <div class="halfmonthly-tab">最新发布</div>
            
            <!-- 半月刊 PDF 预览区 -->
            <div id="pdf-container">
                <p style="color:#999; text-align:center; padding: 50px 0;">正在加载最新半月刊...</p>
            </div>
            
            <!-- 历史半月刊列表 -->
            <h4 style="margin-top: 30px; margin-bottom: 15px; color: #666; font-size: 15px;">往期回顾</h4>
            <ul class="file-list" id="list-halfmonthly"></ul>
        </div>
    </div>

    <!-- 1. 文本通知详情模态框 -->
    <div id="notice-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-title">通知标题</h3>
                <span class="close-btn" onclick="closeModal()">×</span>
            </div>
            <div class="modal-body" id="modal-content">
                <!-- 内容由 JS 渲染 -->
            </div>
            <div class="modal-footer">
                <button onclick="closeModal()" class="modal-btn">我知道了</button>
            </div>
        </div>
    </div>

    <!-- 2. 文件下载提示模态框 (用于拦截Office文件) -->
    <div id="download-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card" style="width: 400px; text-align: center;">
            <div class="modal-header" style="justify-content: center; border-bottom: none; padding-bottom: 0;">
                <h3 style="color: #faad14;">📁 提示</h3>
            </div>
            <div class="modal-body">
                <p style="font-size: 16px; margin-bottom: 20px;">该文件格式（<span id="file-ext" style="color:#f44336; font-weight:bold;"></span>）不支持网页直接预览。</p>
                <a id="download-link" href="#" target="_blank" class="modal-btn" style="text-decoration: none; display: inline-block; background: #1890ff;">点击下载 / 查看原文件</a>
            </div>
            <div class="modal-footer" style="text-align: center; border-top: none;">
                <button onclick="closeModal()" class="modal-btn" style="background: #f5f5f5; color: #333; margin-left: 10px;">取消</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
